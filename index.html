<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>心理调查问卷</title>
  <style>
    :root{--bg:#f7f8fa;--card:#fff;--line:#ddd;--text:#222;--muted:#666}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px;overflow:hidden}

    .terror-mask{position:fixed;inset:0;background:#000;display:grid;place-items:center;z-index:9999}
    .terror-text{color:#d60000;letter-spacing:.35em;font-size:clamp(14px,3vw,18px);animation:flicker 1s infinite}
    @keyframes flicker{0%,100%{opacity:.95}50%{opacity:.28}}

    .box{background:var(--card);width:min(620px,96vw);height:min(90vh,860px);padding:24px 20px;border-radius:12px;box-shadow:0 2px 15px #00000012;display:none;flex-direction:column;position:relative;overflow:hidden;z-index:10}
    .title{text-align:center;font-size:clamp(22px,4vw,24px);font-weight:700;color:#333;margin-bottom:12px}
    .progress{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
    .question{font-size:clamp(16px,3vw,18px);line-height:1.55;color:#222;min-height:54px;margin-bottom:14px}
    .options{display:flex;flex-direction:column;gap:10px;flex:1;overflow:auto;padding-right:4px}
    .option{padding:13px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#fff;transition:.2s;text-align:left}
    .option:hover{transform:translateY(-1px)}
    .option.selected{background:#e2e2e2;border-color:#aaa}

    .btn-group{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
    .btn{padding:11px 18px;border:0;border-radius:8px;cursor:pointer;font-size:16px}
    .prev-btn{background:#eee;color:#333}
    .next-btn{background:#4c4c4c;color:#fff}
    .btn:disabled{opacity:.45;cursor:not-allowed}

    .distort{animation:distort .48s steps(2) 4}
    @keyframes distort{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}}

    .noise-mask{position:fixed;inset:0;pointer-events:none;opacity:0;transition:.35s;z-index:8;background:repeating-linear-gradient(0deg,#00000012 0,#00000012 1px,transparent 1px,transparent 3px)}
    .noise-mask.on{opacity:.35}

    .float-text{position:fixed;pointer-events:none;z-index:9998;color:#111;opacity:.22;animation:rise 3600ms linear forwards;white-space:nowrap}
    @keyframes rise{to{transform:translateY(-80px);opacity:0}}

    .pulse-layer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:7}
    .pulse-layer.flash{animation:pulse .65s ease-out}
    @keyframes pulse{0%{opacity:0}35%{opacity:.26}100%{opacity:0}}

    .result{position:absolute;inset:0;background:#050505;color:#f2f2f2;display:none;place-items:center;text-align:center;padding:24px}
    .result p{line-height:1.75;margin-top:10px}
  </style>
</head>
<body>
  <div class="terror-mask" id="terrorMask"><div class="terror-text" id="terrorText">正在建立连接...</div></div>
  <div class="noise-mask" id="noiseMask"></div>
  <div class="pulse-layer" id="pulseLayer"></div>

  <main class="box" id="box">
    <h1 class="title">心理调查问卷</h1>
    <div class="progress" id="progress"></div>
    <div class="question" id="question"></div>
    <section class="options" id="options"></section>
    <div class="btn-group">
      <button class="btn prev-btn" id="prevBtn">上一题</button>
      <button class="btn next-btn" id="nextBtn">下一题</button>
    </div>

    <section class="result" id="result">
      <div>
        <h2>问卷已完成</h2>
        <p id="resultText"></p>
        <button class="btn next-btn" onclick="location.reload()">重新开始</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { q: '你是否经常在安静时听见不确定来源的声音？', options: ['几乎不会', '偶尔会', '经常发生', '每天都有'] },
      { q: '凌晨独处时手机亮屏，你第一反应是？', options: ['忽略它', '看一眼', '检查所有通知', '直接关机'] },
      { q: '你是否会下意识避免看向某个角落？', options: ['不会', '偶尔', '会', '一直会'] },
      { q: '当你听到背后有脚步声时，你会？', options: ['回头确认', '加快步伐', '停下不动', '不敢回头'] },
      { q: '如果镜子里的你慢了半拍，你认为是？', options: ['错觉', '光线问题', '设备问题', '不再看镜子'] },
      { q: '最后确认：你确定现在只有你在看这份问卷吗？', options: ['确定', '大概', '不太确定', '不确定'] }
    ];

    const stageRules = {
      1: () => spawnFloatingText('你听见了吗'),
      2: () => refs.box.classList.add('distort'),
      3: () => refs.noiseMask.classList.add('on'),
      4: () => { refs.pulseLayer.classList.remove('flash'); void refs.pulseLayer.offsetWidth; refs.pulseLayer.classList.add('flash'); },
      5: () => spawnFloatingText('别回头')
    };

    const state = { index: 0, answers: Array(questions.length).fill(null) };
    const $ = (id) => document.getElementById(id);
    const refs = {
      box: $('box'), progress: $('progress'), question: $('question'), options: $('options'), prevBtn: $('prevBtn'), nextBtn: $('nextBtn'),
      terrorMask: $('terrorMask'), terrorText: $('terrorText'), noiseMask: $('noiseMask'), pulseLayer: $('pulseLayer'), result: $('result'), resultText: $('resultText')
    };

    function getScore() {
      return state.answers.reduce((sum, v) => sum + (v >= 2 ? 1 : 0), 0);
    }

    function renderQuestion() {
      const item = questions[state.index];
      refs.progress.textContent = `第 ${state.index + 1} / ${questions.length} 题`;
      refs.question.textContent = item.q;
      refs.options.innerHTML = '';

      item.options.forEach((text, optionIndex) => {
        const button = document.createElement('button');
        button.className = `option ${state.answers[state.index] === optionIndex ? 'selected' : ''}`;
        button.textContent = text;
        button.onclick = () => selectOption(optionIndex);
        refs.options.appendChild(button);
      });

      refs.prevBtn.disabled = state.index === 0;
      refs.nextBtn.textContent = state.index === questions.length - 1 ? '提交' : '下一题';
      refs.box.classList.remove('distort');
    }

    function selectOption(optionIndex) {
      state.answers[state.index] = optionIndex;
      renderQuestion();
      spawnFloatingText();
    }

    function spawnFloatingText(text) {
      const pool = ['别回头', '它在后面', '看见你了', '你听见了吗'];
      const node = document.createElement('div');
      node.className = 'float-text';
      node.textContent = text || pool[Math.floor(Math.random() * pool.length)];
      node.style.left = `${Math.random() * 80 + 10}vw`;
      node.style.top = `${Math.random() * 70 + 12}vh`;
      node.style.fontSize = `${14 + Math.floor(Math.random() * 7)}px`;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 3500);
    }

    function runStageEffects() {
      if (stageRules[state.index]) stageRules[state.index]();
    }

    function nextStep() {
      if (state.answers[state.index] === null) return alert('请先选择一个选项。');
      if (state.index < questions.length - 1) {
        state.index += 1;
        renderQuestion();
        runStageEffects();
        return;
      }

      const score = getScore();
      refs.resultText.textContent = score >= 4
        ? '你目前对环境刺激较敏感。建议减少夜间高刺激内容，保持规律作息。'
        : '你的状态整体稳定。继续保持正常作息和放松节奏即可。';
      refs.result.style.display = 'grid';
    }

    refs.prevBtn.onclick = () => {
      if (state.index > 0) {
        state.index -= 1;
        renderQuestion();
        if (state.index < 3) refs.noiseMask.classList.remove('on');
      }
    };
    refs.nextBtn.onclick = nextStep;

    const loadingText = ['正在建立连接...', '正在读取档案...', '正在同步访客记录...'];
    let cursor = 0;
    const loadingTimer = setInterval(() => {
      refs.terrorText.textContent = loadingText[cursor % loadingText.length];
      cursor += 1;
    }, 450);

    setTimeout(() => {
      clearInterval(loadingTimer);
      refs.terrorMask.remove();
      refs.box.style.display = 'flex';
      renderQuestion();
    }, 1800);
  </script>
</body>
</html>
